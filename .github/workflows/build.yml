name: Build Claudius PDF Editor for Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write           # write is only used to attach files to a Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check that all program files are present and compile
        run: |
          foreach ($f in "splash.png","FREEWARE.txt","LICENSE","claudius.ico","installer.iss","version_info.txt","claudius.py","claudius_extra.py","claudius_i18n.py","claudius_theme.py","claudius_lang.py","claudius_print.py","claudius_features.py","claudius_view.py","claudius_pro.py","claudius_v3.py","claudius_v3b.py") { if (-not (Test-Path $f)) { throw "Missing file: $f" } }
          python -m py_compile claudius.py claudius_extra.py claudius_i18n.py claudius_theme.py claudius_lang.py claudius_print.py claudius_features.py claudius_view.py claudius_pro.py claudius_v3.py claudius_v3b.py
      - name: Build EXE
        run: python -m PyInstaller --noconsole --onefile --name "Claudius PDF Editor" --icon claudius.ico --splash splash.png --version-file version_info.txt --collect-data docx --collect-data pptx --collect-submodules docx --collect-submodules pptx --collect-submodules openpyxl --collect-all tkinterdnd2 --hidden-import claudius_extra --hidden-import claudius_i18n --hidden-import claudius_theme --hidden-import claudius_lang --hidden-import claudius_print --hidden-import claudius_features --hidden-import claudius_view --hidden-import claudius_pro --hidden-import claudius_v3 --hidden-import claudius_v3b claudius.py
      - name: Checksums
        run: |
          Get-FileHash "dist\Claudius PDF Editor.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Claudius PDF Editor.exe" } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Claudius-PDF-Editor-windows-x64
          path: |
            dist/Claudius PDF Editor.exe
            dist/SHA256SUMS.txt
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Claudius-PDF-Editor-installer
          path: installer/*.exe
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Claudius PDF Editor.exe
            dist/SHA256SUMS.txt
            installer/*.exe
          generate_release_notes: true
